<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Arquitectura distribuida cliente-servidor (PFO 3)</text>
<text x="40" y="62" font-size="11" fill="#777">CAPA 1 - Clientes</text>
