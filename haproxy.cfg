# Alternativa a Nginx: HAProxy en modo TCP. Archivo de referencia, no ejecutado aqui.
defaults
    mode tcp
    timeout connect 2s
    timeout client  60s
    timeout server  60s

frontend clientes
    bind *:8000
    default_backend dispatchers

backend dispatchers
    balance leastconn
    server d1 127.0.0.1:9000 check
    server d2 127.0.0.1:9100 check
