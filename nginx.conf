# Balanceador L4 (TCP) delante de los dispatchers. Archivo de referencia:
# no fue ejecutado en este entorno; requiere el modulo "stream" de Nginx.
worker_processes auto;
events { worker_connections 1024; }

stream {
    upstream dispatchers {
        least_conn;                                   # al dispatcher con menos conexiones activas
        server 127.0.0.1:9000 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:9100 max_fails=2 fail_timeout=10s;
    }
    server {
        listen 8000;                                  # puerto publico que usan los clientes
        proxy_pass dispatchers;
        proxy_connect_timeout 2s;
    }
}
